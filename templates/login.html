{% extends "base.html" %}

{% block title %}
Login - TechZone
{% endblock %}


{% block content %}

<section class="auth-page">

    <form
        class="auth-card"
        method="post"
        onsubmit="trackLogin()"
    >

        <h1>
            Login
        </h1>

        <p>
            Welcome back to TechZone.
        </p>


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button
            class="btn full"
            type="submit"
        >

            Login

        </button>


        <p>

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </form>

</section>

{% endblock %}
