{% extends "base.html" %}

{% block title %}
{{ product.name }} - TechZone
{% endblock %}

{% block content %}

<section class="detail-page">

    <div class="detail-image">
        {{ product.icon }}
    </div>

    <div class="detail-info">

        <p class="category-label">
            {{ product.category }}
        </p>

        <h1>
            {{ product.name }}
        </h1>

        <p class="price big">
            ₹{{ "{:,.0f}".format(product.price) }}
        </p>

        <p>
            {{ product.description }}
        </p>

        <form
            action="{{ url_for('add_to_cart', product_id=product.id) }}"
            method="post"
            onsubmit="return trackAddToCartAndSubmit(
                this,
                {{ product.id|tojson }},
                {{ product.name|tojson }},
                {{ product.category|tojson }},
                {{ product.price }}
            );"
        >

            <label>
                Quantity
            </label>

            <input
                class="quantity"
                type="number"
                name="quantity"
                value="1"
                min="1"
            >

            <button class="btn" type="submit">
                Add to Cart
            </button>

        </form>

    </div>

</section>


<script>

function trackAddToCartAndSubmit(form, productId, productName, category, price) {

    const quantityInput = form.querySelector('input[name="quantity"]');
    const quantity = Math.max(1, Number(quantityInput.value || 1));

    const submitForm = () => {
        form.submit();
    };

    // Send Add to Cart event to Google Analytics
    if (typeof gtag === "function") {

        gtag("event", "add_to_cart", {
            currency: "INR",
            value: price * quantity,

            items: [
                {
                    item_id: String(productId),
                    item_name: productName,
                    item_category: category,
                    price: Number(price),
                    quantity: quantity
                }
            ]
        });

    }

    // Give GA4 a short time to send the event
    // before the page redirects.
    setTimeout(submitForm, 700);

    // Prevent the browser's immediate form submission
    return false;
}


trackViewItem(
    "{{ product.id }}",
    "{{ product.name }}",
    "{{ product.category }}",
    {{ product.price }}
);

</script>

{% endblock %}
